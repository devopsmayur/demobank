# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Validate against the current CodeRabbit schema before rollout (keys evolve).
language: "en-US"

knowledge_base:
  code_guidelines:
    # Registers the EBA control digest as a review guideline. CodeRabbit scopes a guideline file to its
    # own directory and below, so the file lives at the repo root to cover the whole repository.
    filePatterns:
      - "EBA_ICT_OUTSOURCING_CONTROLS.md"

reviews:
  profile: "assertive"
  request_changes_workflow: true

  path_instructions:
    - path: "**"
      instructions: |
        REGULATORY CITATION RULE. The file EBA_ICT_OUTSOURCING_CONTROLS.md at the repo root defines
        the controls derived from EBA/GL/2019/02 (outsourcing) and EBA/GL/2019/04 (ICT & security risk).
        For every finding about third-party ICT, vendors, SDKs, endpoints, data sent to vendors,
        resilience of vendor calls, or the vendor register, end the comment with a line in this exact form:
        "EBA control: <CONTROL-ID> (<guideline> s.<section>, paras <range>) - see EBA_ICT_OUTSOURCING_CONTROLS.md"
        Use only control IDs that exist in that file. Do not invent IDs or paragraph numbers.
        Quick map: new host/SDK not in register -> OUTS-11, OUTS-12.3, ICT-3.6.2; new data field to vendor
        -> OUTS-12.2, OUTS-13.2, ICT-3.3.3; direct HTTP client or endpoint from env/config -> ICT-3.4.2,
        ICT-3.4.5; missing timeout, retry or fail-closed path -> OUTS-09, ICT-3.5; critical vendor without
        exit plan -> OUTS-15; register changed without ticket or approvers -> ICT-3.6.3, OUTS-07.
    - path: "payment_service/integrations/**"
      instructions: |
        This folder is the ONLY place where data may leave the bank's trust boundary.
        - Each function that talks to an external endpoint must carry
          @third_party("<vendor id>", [<data classes>]) matching governance/approved-vendors.yaml.
          (EBA control OUTS-11)
        - Outbound calls must use payment_service.egress.guarded_post_json. Flag direct use of
          requests/httpx/urllib/socket/smtplib or any endpoint taken from env vars or config.
          (EBA controls ICT-3.4.2, ICT-3.4.5)
        - Flag any new data field added to a vendor payload that is not in that vendor's data_classes.
          (EBA controls OUTS-13.2, ICT-3.3.3)
        - Flag removal of timeouts, retries/fallbacks, or the fail-closed behaviour for critical vendors.
          (EBA controls OUTS-09, ICT-3.5)
        Cite the control ID and EBA_ICT_OUTSOURCING_CONTROLS.md in each finding.
    - path: "governance/**"
      instructions: |
        Changes to the vendor register are control changes (EBA controls OUTS-11, OUTS-12.3, ICT-3.6.3).
        Require a TPRM ticket reference in the PR description, and check that every external vendor has
        dora_register_id, assessment_ticket, next_review, exit_plan and data_location. Flag any widening of
        hosts or data_classes without a linked re-assessment. Flag a critical_or_important vendor without
        an existing exit_plan file (OUTS-15) or without subcontractors information (OUTS-13.1).
        Cite the control ID and EBA_ICT_OUTSOURCING_CONTROLS.md in each finding.
    - path: "**/requirements*.txt"
      instructions: |
        Every added or changed dependency must exist in governance/approved-vendors.yaml
        (libraries or a vendor sdk). Flag unpinned versions and SDKs that call external services.
        Cite EBA controls ICT-3.6.2 and OUTS-12.3 and EBA_ICT_OUTSOURCING_CONTROLS.md.
    - path: "**/{Dockerfile,*.tf,*.tfvars,helm/**,k8s/**}"
      instructions: |
        Flag new egress rules, public endpoints, new cloud services/regions, and secrets or
        vendor URLs added to infrastructure code. Cite EBA controls ICT-3.4.2 and OUTS-13.2
        and EBA_ICT_OUTSOURCING_CONTROLS.md.

  pre_merge_checks:
    custom_checks:
      - name: "ICT-3P-Endpoint-Allowlist"
        mode: "error"
        instructions: |
          FAIL if the PR adds or changes any hostname, URL, webhook, queue/bucket name or
          connection string that is not listed under `hosts` in governance/approved-vendors.yaml.
          FAIL if an endpoint is read from an environment variable or remote config in application
          code instead of being declared in the register. PASS otherwise.
          In the explanation, cite EBA controls OUTS-11, OUTS-12.3 (and ICT-3.4.2 for env/config
          endpoints) with their section and paragraph range from EBA_ICT_OUTSOURCING_CONTROLS.md.
      - name: "ICT-3P-SDK-Approval"
        mode: "error"
        instructions: |
          FAIL if the PR adds a dependency or import of an SDK/client library for an external
          service that is not listed as `libraries` or a vendor `sdk` in governance/approved-vendors.yaml.
          FAIL if a new HTTP/gRPC/SMTP client is imported outside payment_service/egress.py.
          PASS if no new dependencies or only approved ones are added.
          In the explanation, cite EBA controls ICT-3.6.2 and OUTS-12.3 (and ICT-3.4.2 for the egress
          bypass) with section and paragraph range from EBA_ICT_OUTSOURCING_CONTROLS.md.
      - name: "ICT-3P-Data-Minimisation"
        mode: "error"
        instructions: |
          FAIL if a function decorated with @third_party sends a field whose data class is not
          in that vendor's `data_classes`, or if the decorator lists a class that is not approved.
          ALSO FAIL if personal or payment data (iban, name, email, account number, amount) is sent
          to any external host from a function that has no @third_party declaration.
          PASS otherwise.
          In the explanation, cite EBA controls OUTS-13.2, ICT-3.3.3 and OUTS-12.2 with section and
          paragraph range from EBA_ICT_OUTSOURCING_CONTROLS.md.
      - name: "ICT-Vendor-Resilience"
        mode: "warning"
        instructions: |
          FAIL if a changed or added outbound call to an external vendor has no explicit timeout, or if
          the PR removes retries, fallbacks, manual-review routing or fail-closed behaviour for a vendor
          whose criticality is critical_or_important in governance/approved-vendors.yaml. PASS otherwise.
          In the explanation, cite EBA controls OUTS-09 and ICT-3.5 from EBA_ICT_OUTSOURCING_CONTROLS.md.
      - name: "ICT-Register-Change-Control"
        mode: "warning"
        instructions: |
          If governance/approved-vendors.yaml changes, FAIL unless the PR description contains a
          TPRM ticket id (pattern TPRM-\d+) and any new external vendor has all of: dora_register_id,
          criticality, exit_plan (existing file), next_review, data_location. PASS if the file is unchanged.
          In the explanation, cite EBA controls ICT-3.6.3, OUTS-11 and OUTS-15 from
          EBA_ICT_OUTSOURCING_CONTROLS.md.
